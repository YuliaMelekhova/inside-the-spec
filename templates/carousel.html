<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Inside the Spec – master template v0.1</title>
<style>
:root{--paper:#f7f4ee;--ink:#293c3c;--teal:#607f7a;--ochre:#b09161;--line:#d7deda;--soft:#edf1ef}
*{box-sizing:border-box}body{margin:0;background:#d7deda;color:var(--ink);font-family:Arial,"DejaVu Sans",sans-serif}
nav{padding:16px;text-align:center}button,select{font:inherit;padding:8px 16px;margin:4px}
.page{width:800px;height:1000px;padding:54px 56px 72px;margin:24px auto;background:var(--paper);position:relative;break-after:page}
.eyebrow{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:28px}
h1{font-family:Georgia,"DejaVu Serif",serif;font-size:57px;line-height:1.12;font-weight:normal;margin:60px 0 28px}
h2{font-family:Georgia,"DejaVu Serif",serif;font-size:38px;line-height:1.16;font-weight:normal;margin:0 0 26px}
p,li{font-size:23px;line-height:1.5} .subtitle{font-size:19px;line-height:1.5;max-width:580px}
.panel{background:var(--soft);padding:25px;margin:24px 0;border-left:4px solid var(--teal)}
.note{border-top:2px solid var(--ochre);padding-top:18px;font-size:20px;line-height:1.5}
footer{position:absolute;bottom:28px;left:56px;right:56px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:19px;line-height:1.45;margin:30px 0}td,th{text-align:left;vertical-align:top;padding:16px 12px;border-bottom:1px solid var(--line)}th{background:var(--soft);font-weight:600}
code,pre{font-family:"DejaVu Sans Mono",monospace}pre{font-size:19px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:28px}
.diagram{display:grid;gap:18px;margin:34px 0}.node{padding:22px;border:1px solid var(--teal);font-size:23px;text-align:center}.arrow{text-align:center;font-size:19px}.sun{width:64px;height:32px;border-radius:64px 64px 0 0;background:var(--ochre);opacity:.35;margin-top:60px}
@page{size:200mm 250mm;margin:0}
@media print{body{background:white}nav{display:none}.page{width:200mm;height:250mm;margin:0;padding:13.5mm 14mm 18mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}footer{left:14mm;right:14mm;bottom:7mm}h1{font-size:43pt}h2{font-size:28pt}p,li{font-size:17pt}table{font-size:14pt}pre{font-size:14pt}}
</style>
<nav><select id="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option></select><button onclick="window.print()">Save as PDF / Сохранить PDF</button></nav>
<main id="pages"></main>
<script>
// Edit content here. Keep stable page IDs across translations.
// These six pages demonstrate layouts; they are not the finished payment case.
const copy={
en:{label:"Layout sample",title:"The API Timed Out. Did the Payment Succeed?",subtitle:"Real Scenarios. Working Artifacts. Decisions That Matter.",scope:"One payment. An unresolved outcome.",scenario:"The provider may have accepted the payment before our request timed out. We need evidence before deciding what happens next.",rule:"A timeout does not prove that the payment failed.",diagram:"State diagram layout",unknown:"Outcome unknown",confirmed:"Confirmed outcome",event:"Verified provider result ↓",table:"Decision table layout",heads:["Condition","Action","Check"],rows:[["Same key, same request","Return or track the existing operation","No new operation"],["Same key, changed amount","Reject the conflicting request","Original operation unchanged"]],contract:"Specification fragment layout",code:"operation_id: payment-001\namount_minor: 5000\ncurrency: EUR\nstatus: OUTCOME_UNKNOWN",annotation:"Use stable identifiers. Keep request attempts separate from the payment operation.",checks:"Validation layout",items:["A repeated request cannot create a second internal operation.","A late success updates the existing payment.","An unresolved outcome remains visible for investigation."],closing:"Working files",closingText:"Publish the completed case, editable tables, diagrams and both language versions in the episode folder.",draft:"Template v0.1 · Layout samples"},
ru:{label:"Пример оформления",title:"API не ответил вовремя. Платёж прошёл?",subtitle:"Real Scenarios. Working Artifacts. Decisions That Matter.",scope:"Один платёж. Результат пока неизвестен.",scenario:"Провайдер мог принять платёж до истечения времени ожидания. Для следующего решения нужно подтверждение результата.",rule:"Таймаут не доказывает, что платёж завершился ошибкой.",diagram:"Макет диаграммы состояний",unknown:"Результат неизвестен",confirmed:"Результат подтверждён",event:"Проверенный результат провайдера ↓",table:"Макет таблицы решений",heads:["Условие","Действие","Проверка"],rows:[["Тот же ключ и запрос","Вернуть существующую операцию или её статус","Новая операция не создаётся"],["Тот же ключ, другая сумма","Отклонить конфликтующий запрос","Исходная операция не меняется"]],contract:"Макет фрагмента спецификации",code:"operation_id: payment-001\namount_minor: 5000\ncurrency: EUR\nstatus: OUTCOME_UNKNOWN",annotation:"Используйте постоянные идентификаторы. Отделяйте попытки запроса от платёжной операции.",checks:"Макет проверок",items:["Повторный запрос не создаёт вторую внутреннюю операцию.","Позднее подтверждение успеха обновляет существующий платёж.","Неопределённый результат остаётся видимым для проверки."],closing:"Рабочие файлы",closingText:"Готовый кейс, редактируемые таблицы, диаграммы и обе языковые версии размещаются в папке выпуска.",draft:"Шаблон v0.1 · Примеры макетов"}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(lang){
document.documentElement.lang=lang; const t=copy[lang];
const layouts=[
'<div class="subtitle">Inside the Spec<br>'+esc(t.subtitle)+'</div><div class="sun"></div><h1>'+esc(t.title)+'</h1><p>'+esc(t.label)+'</p>',
'<h2>'+esc(t.scope)+'</h2><p>'+esc(t.scenario)+'</p><div class="panel"><p>'+esc(t.rule)+'</p></div><div class="note">'+esc(t.draft)+'</div>',
'<h2>'+esc(t.diagram)+'</h2><div class="diagram"><div class="node">'+esc(t.unknown)+'</div><div class="arrow">'+esc(t.event)+'</div><div class="node">'+esc(t.confirmed)+'</div></div><div class="note">'+esc(t.rule)+'</div>',
'<h2>'+esc(t.table)+'</h2><table><thead><tr>'+t.heads.map(s=>'<th>'+esc(s)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(row=>'<tr>'+row.map(s=>'<td>'+esc(s)+'</td>').join('')+'</tr>').join('')+'</tbody></table>',
'<h2>'+esc(t.contract)+'</h2><pre>'+esc(t.code)+'</pre><p>'+esc(t.annotation)+'</p>',
'<h2>'+esc(t.checks)+'</h2><ol>'+t.items.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><div class="panel"><h2>'+esc(t.closing)+'</h2><p>'+esc(t.closingText)+'</p></div>'
];
document.getElementById('pages').innerHTML=layouts.map((html,i)=>'<section class="page"><div class="eyebrow">Inside the Spec · 01 · '+lang.toUpperCase()+'</div>'+html+'<footer><span>Yulia Melekhova · '+esc(t.draft)+'</span><span>'+(i+1)+' / '+layouts.length+'</span></footer></section>').join('');
}
document.getElementById('language').addEventListener('change',e=>render(e.target.value)); render('en');
</script>
</html>
